name: build
on: { push: { branches: [ci-build] } }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: build
        run: |
          set +e
          npm run build > build.log 2>&1; code=$?
          if [ $code -ne 0 ]; then msg=$(tail -c 3500 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g'); echo "::warning title=build::$msg"; fi
          exit $code
      - name: screenshots
        run: |
          (npx next start -p 3000 > /tmp/server.log 2>&1 &) ; sleep 8
          mkdir -p /tmp/shots/out && cd /tmp/shots && npm init -y >/dev/null && npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cp $GITHUB_WORKSPACE/.github/shots.js s.js && (node s.js > shots.log 2>&1 || (msg=$(tail -c 3000 shots.log | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::warning title=shots::$msg"))
          cd $GITHUB_WORKSPACE && git checkout -B ci-shots && rm -rf shots && mkdir shots && cp /tmp/shots/out/* shots/ && cp /tmp/server.log shots/
          git add -f shots && git -c user.name=ci -c user.email=ci@x commit -qm shots && git push -f origin ci-shots
